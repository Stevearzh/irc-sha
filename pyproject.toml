[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irc-sha"
version = "0.1.0"
description = "a sha-like game played in irc"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["isha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
